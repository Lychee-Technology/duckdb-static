AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  duckdb-static-bundle-example

  SAM Template for duckdb-static-bundle-example

Parameters:
  Architecture:
    Type: String
    Default: arm64
    AllowedValues:
      - arm64
      - x86_64
    Description: >
      Lambda architecture. Must match the Makefile's ARCH, which builds the
      binary: arm64 with ARCH=arm64, x86_64 with ARCH=amd64.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    LoggingConfig:
      LogFormat: JSON

Resources:
  DuckDBParquetFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - !Ref Architecture
