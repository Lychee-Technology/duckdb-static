# Runs example/README.md's build-and-invoke commands on native arm64 and x86_64
# runners and fails unless the output contains the README's expected line. The
# commands and the expected line are read from the README, from the code block
# below each "<!-- .github/workflows/example.yml ... -->" comment, so CI runs
# exactly what the README says.
name: Example

on:
  pull_request:
    branches: [duckdb-v1.5.x]
    paths:
      - 'example/**'
      - '.github/workflows/example.yml'
  push:
    branches: [duckdb-v1.5.x]
    paths:
      - 'example/**'
      - '.github/workflows/example.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      bundle-artifact:
        description: Test the bundles uploaded by the calling run's build job instead of the newest release of duckdb_version.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # duckdb-go's versions encode the DuckDB version they were released for:
      # v2.10506.0 and v0.10506.0 are DuckDB 1.5.6. The bindings compile against
      # their own duckdb.h, so they must be the ones for the bundle's DuckDB,
      # which is duckdb_version's in both kinds of run.
      - name: Check go.mod's duckdb-go against duckdb_version
        shell: bash
        run: |
          source ./duckdb_version
          status=0
          for module in github.com/duckdb/duckdb-go/v2 github.com/duckdb/duckdb-go-bindings; do
            version=$(awk -v m="$module" '$1 == m { print $2 }' example/go.mod)
            n=${version#v*.}
            n=${n%%.*}
            if [[ ! $n =~ ^[0-9]+$ ]]; then
              echo "::error file=example/go.mod::Can't read a DuckDB version from $module '$version'."
              status=1
              continue
            fi
            duckdb=v$((10#$n / 10000)).$((10#$n / 100 % 100)).$((10#$n % 100))
            echo "$module $version is for DuckDB $duckdb"
            if [ "$duckdb" != "$DUCKDB_VER" ]; then
              echo "::error file=example/go.mod::$module $version is for DuckDB $duckdb, but duckdb_version is $DUCKDB_VER. Use the duckdb-go release for $DUCKDB_VER."
              status=1
            fi
          done
          exit $status

      # Between changing duckdb_version and releasing that version, no release
      # holds the bundle this commit's go.mod is for. The README jobs then show
      # as skipped rather than passed. The build workflow's run for the same
      # change tests the example against the bundles it builds.
      - name: Find the newest release of duckdb_version
        id: release
        if: ${{ !inputs.bundle-artifact }}
        shell: bash
        run: |
          source ./duckdb_version
          for arch in arm64 amd64; do
            status=0
            url=$(example/release-url.sh "$DUCKDB_VER" "$arch" httpfs-parquet) || status=$?
            if [ "$status" -eq 2 ]; then
              echo "::notice title=Example skipped::No release is tagged ${DUCKDB_VER}_<n>, so the README jobs are skipped. Run the build workflow on this branch to test the example against a bundle built from it."
              exit 0
            fi
            [ "$status" -eq 0 ] || exit "$status"
            echo "$arch: $url"
          done
          tag=${url%/*}
          echo "tag=${tag##*/}" >> "$GITHUB_OUTPUT"

  readme:
    name: README (${{ matrix.host }})
    needs: versions
    if: inputs.bundle-artifact || needs.versions.outputs.release != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            host: arm64
            arch: arm64
          - runner: ubuntu-latest
            host: x86_64
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SAM_CLI_TELEMETRY: '0'
      AWS_DEFAULT_REGION: us-east-1
      TARBALL: libduckdb_bundle-${{ matrix.arch }}-linux-httpfs-parquet.tar.xz

    steps:
      - uses: actions/checkout@v6

      - name: Tools
        run: |
          uname -m
          docker version --format '{{.Server.Version}} {{.Server.Arch}}'
          sam --version

      - name: Download the bundle built in this run
        if: ${{ inputs.bundle-artifact }}
        uses: actions/download-artifact@v7
        with:
          name: libduckdb-${{ matrix.arch }}-httpfs-parquet
          path: ${{ runner.temp }}/bundle

      - name: Check that it is the tarball the build smoke-tested
        if: ${{ inputs.bundle-artifact }}
        working-directory: ${{ runner.temp }}/bundle
        run: sha256sum -c "$TARBALL.sha256"

      - name: Run the README commands
        shell: bash
        env:
          HOST: ${{ matrix.host }}
          # Read by make download-libs; empty means download the newest release
          # of duckdb_version.
          BUNDLE_TARBALL: ${{ inputs.bundle-artifact && format('{0}/bundle/{1}', runner.temp, env.TARBALL) || '' }}
        run: |
          # Prints the body of the first fenced code block after the line
          # "<!-- $1 -->" in example/README.md.
          readme_block() {
            awk -v marker="<!-- $1 -->" '
              $0 == marker { found = 1; next }
              found && /^```/ { if (inside) exit; inside = 1; next }
              inside
            ' example/README.md
          }
          commands=$(readme_block ".github/workflows/example.yml runs this block on $HOST")
          expected=$(readme_block ".github/workflows/example.yml expects this output")
          if [ -z "$commands" ] || [ -z "$expected" ] || [ "$(wc -l <<<"$expected")" -ne 1 ]; then
            echo "::error file=example/README.md::Found no $HOST commands block or no one-line expected-output block. Each must follow its <!-- .github/workflows/example.yml ... --> comment."
            exit 1
          fi

          bash -euxo pipefail -c "$commands" | tee "$RUNNER_TEMP/stdout.txt"
          # sam local invoke prints the result without a trailing newline, and
          # workflow commands such as ::error only work at the start of a line.
          echo

          # make download-libs records where the bundle came from: a release
          # asset's URL, or the path of BUNDLE_TARBALL.
          {
            echo "### Example ($HOST)"
            echo "Bundle: \`$(cat example/libs/parquet/url.txt)\`"
            if [ -n "$BUNDLE_TARBALL" ]; then
              echo "Smoke-tested: \`$(cat "$BUNDLE_TARBALL.sha256")\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if ! grep -Fxq -- "$expected" "$RUNNER_TEMP/stdout.txt"; then
            echo "::error file=example/README.md::The output has no line matching the README's expected output: $expected"
            exit 1
          fi
          echo "Output matches the README: $expected"
