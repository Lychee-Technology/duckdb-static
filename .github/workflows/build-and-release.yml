name: Build DuckDB static bundle on Amazon Linux 2023

on:
  # A tag push builds and releases. A push to this branch, or a PR into it,
  # that changes what the bundle is built or tested from builds and tests its
  # own bundles. Markdown under these paths isn't read by the build or the
  # tests, so a change to Markdown alone doesn't build. GitHub doesn't apply
  # path filters to tag pushes.
  push:
    tags:
      - 'v*'
    branches:
      - duckdb-v1.5.x
    paths:
      - 'duckdb_version'
      - 'test/**'
      - '.github/workflows/build-and-release.yml'
      - '!**/*.md'
  pull_request:
    branches:
      - duckdb-v1.5.x
    paths:
      - 'duckdb_version'
      - 'test/**'
      - '.github/workflows/build-and-release.yml'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      overwrite-release:
        description: On a tag that already has a release, replace its assets with this run's. Without it, the release job refuses.
        type: boolean
        default: false

# A new push to a PR cancels the PR's earlier run. Every other run has a group
# of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: 'ubuntu-24.04-arm'
            platform: arm64-linux
            build_extensions: 'httpfs;parquet;icu;json;'
            flavor: 'httpfs-parquet'
            DUCKDB_PLATFORM: linux_arm64
            CXXFLAGS: "-march=armv8.2-a+crypto+fp16+dotprod+lse -D_GLIBCXX_USE_CXX11_ABI=1"
          - arch: amd64
            runner: 'ubuntu-latest'
            platform: amd64-linux
            build_extensions: 'httpfs;parquet;icu;json;'
            flavor: 'httpfs-parquet'
            DUCKDB_PLATFORM: linux_amd64
            CXXFLAGS: "-march=x86-64-v3 -D_GLIBCXX_USE_CXX11_ABI=1"

    runs-on: ${{ matrix.runner }}

    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023

    steps:
      - name: Install basic tools
        run: |
          dnf update -y
          dnf install --allowerasing \
            wget tar gzip xz git \
            gcc14 gcc14-c++ \
            make curl ninja-build patch \
            openssl-devel zlib-devel libcurl-devel \
            python3 -y

      - name: Install latest CMake
        run: |
          CMAKE_VER="3.31.10"
          case "${{ matrix.platform }}" in
            amd64-linux)  CMAKE_ARCH="linux-x86_64" ;;
            arm64-linux)  CMAKE_ARCH="linux-aarch64" ;;
            *) echo "Unsupported platform: ${{ matrix.platform }}"; exit 1 ;;
          esac
          wget -q -O cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-${CMAKE_ARCH}.tar.gz
          tar -zxf cmake.tar.gz
          cp -rf cmake-${CMAKE_VER}-${CMAKE_ARCH}/* /usr/local/ 2>/dev/null
          cmake --version

      - name: Checkout repository
        uses: actions/checkout@v6

      # This branch builds DuckDB 1.5.x only; main builds 2.0. A tag must be
      # v<DUCKDB_VER>_<n>, so no tag publishes a bundle under another DuckDB
      # version's name. Earlier workflows released every 1.5.x tag up to
      # v1.5.6_0, and a tag push skips the release's overwrite guard, so a tag
      # must also come after v1.5.6_0: re-pushing an old one would otherwise
      # replace its published assets. Failing here, before the build, also
      # fails the release.
      - name: Set version variables
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          source ./duckdb_version
          if [[ ! $DUCKDB_VER =~ ^v1\.5\.[0-9]+$ ]]; then
            echo "::error title=Not DuckDB 1.5.x::duckdb_version sets DUCKDB_VER=$DUCKDB_VER, but duckdb-v1.5.x builds v1.5.<patch> only."
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            if [[ ! $TAG =~ ^v[0-9.]+_[0-9]+$ || ${TAG%_*} != "$DUCKDB_VER" ]]; then
              echo "::error title=Tag doesn't match duckdb_version::Tag $TAG must be ${DUCKDB_VER}_<n>, because the commit builds DuckDB $DUCKDB_VER."
              exit 1
            fi
            patch=${DUCKDB_VER##*.} n=${TAG##*_}
            if (( 10#$patch < 6 || (10#$patch == 6 && 10#$n < 1) )); then
              echo "::error title=Tag already released::Tag $TAG is at or before v1.5.6_0, the tags earlier workflows released. Tag this build v1.5.6_1 or later."
              exit 1
            fi
          fi
          echo "DUCKDB_VER=$DUCKDB_VER" >> $GITHUB_ENV
          echo "DUCKDB_EXTENSION_CI_TOOLS_BRANCH=$DUCKDB_EXTENSION_CI_TOOLS_BRANCH" >> $GITHUB_ENV

      - name: Clone DuckDB
        run: git clone --depth 1 --branch $DUCKDB_VER https://github.com/duckdb/duckdb.git

      - name: Build DuckDB bundle
        run: |
          pushd duckdb
          mkdir -p build/release/vcpkg_installed/${{ matrix.platform }}/lib

          export CC=/usr/bin/gcc14-gcc
          export CXX=/usr/bin/gcc14-g++
          export LDFLAGS="-Wl,--gc-sections -Wl,--strip-all"
          export CXXFLAGS="${{ matrix.CXXFLAGS }} -ffunction-sections -fdata-sections"
          export CFLAGS="${{ matrix.CXXFLAGS }} -ffunction-sections -fdata-sections"
          export MAKEFLAGS="-j$(nproc)"

          echo "Compiler version:"
          $CXX --version | head -1

          GEN=ninja \
          DUCKDB_PLATFORM=${{ matrix.DUCKDB_PLATFORM }} \
          BUILD_SHELL=0 \
          DISABLE_EXTENSION_LOAD=1 \
          EXTENSION_STATIC_BUILD=1 \
          BUILD_EXTENSIONS="${{ matrix.build_extensions }}" \
          EXTRA_CMAKE_VARIABLES="-DCMAKE_CXX_FLAGS_RELEASE=-Os -DCMAKE_C_FLAGS_RELEASE=-Os" \
          make bundle-library
          objcopy --strip-debug build/release/libduckdb_bundle.a
          popd

      - name: Package bundle
        run: |
          mkdir -p /tmp/pkg
          cp duckdb/build/release/libduckdb_bundle.a /tmp/pkg/
          echo "Package contents:"
          ls -lh /tmp/pkg/
          tar -cJf libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz -C /tmp/pkg .

      # The tarball ships only the archive, so the smoke test compiles against
      # the duckdb.h of the DuckDB checkout the bundle was built from.
      - name: Collect header
        run: |
          mkdir -p include
          cp duckdb/src/include/duckdb.h include/

      - name: Smoke-test bundle
        env:
          CC: /usr/bin/gcc14-gcc
        run: |
          test/smoke.sh libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz "$DUCKDB_VER" include

      # Identifies the tarball the smoke test just passed. The artifact carries
      # the sha256 file, so a job that downloads the tarball can check that it
      # has the same bytes.
      - name: Record sha256
        env:
          TARBALL: libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz
        run: |
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          cat "$TARBALL.sha256"
          echo "Smoke-tested: \`$(cat "$TARBALL.sha256")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libduckdb-${{ matrix.arch }}-${{ matrix.flavor }}
          path: |
            libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz
            libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz.sha256
          retention-days: 1

      # Lets test/smoke.sh run on this build's tarball without a DuckDB
      # checkout. Not named libduckdb-*, because the release job downloads
      # every artifact matching that pattern into the directory it releases
      # from.
      - name: Upload header
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-header-${{ matrix.arch }}
          path: include/duckdb.h
          retention-days: 1

  # Runs the fixture queries over real HTTPS on the bundles above, in a fresh
  # Amazon Linux 2023 container, against the copy of test/fixtures/public at the
  # repository variable DUCKDB_TEST_HTTPFS_BASE_URL. Without the variable the
  # job shows as skipped. The release doesn't wait for it, because GitHub can
  # fail or rate-limit the reads while the bundle is fine.
  httpfs-remote:
    name: httpfs remote (${{ matrix.arch }})
    needs: build
    if: vars.DUCKDB_TEST_HTTPFS_BASE_URL != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: 'ubuntu-24.04-arm'
          - arch: amd64
            runner: 'ubuntu-latest'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read

    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023

    env:
      TARBALL: libduckdb_bundle-${{ matrix.arch }}-linux-httpfs-parquet.tar.xz

    steps:
      - name: Install tools
        run: dnf install -y git gcc14 gcc14-c++ libcurl-devel openssl-devel binutils findutils tar xz python3

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the bundle built in this run
        uses: actions/download-artifact@v7
        with:
          name: libduckdb-${{ matrix.arch }}-httpfs-parquet

      - name: Check that it is the tarball the build smoke-tested
        run: sha256sum -c "$TARBALL.sha256"

      # The tarball holds no header, so the test compiles against the one the
      # build uploaded from its DuckDB checkout.
      - name: Download the header built in this run
        uses: actions/download-artifact@v7
        with:
          name: duckdb-header-${{ matrix.arch }}
          path: include

      # The token reaches this step only. test/smoke.sh sends it only to this
      # repository's files on raw.githubusercontent.com and never prints it.
      - name: Smoke-test over HTTPS
        shell: bash
        env:
          CC: /usr/bin/gcc14-gcc
          DUCKDB_TEST_HTTPFS_BASE_URL: ${{ vars.DUCKDB_TEST_HTTPFS_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # test/smoke.sh takes http:// for local runs. Here it would let the
          # job pass without testing TLS, which no other check does.
          url=$DUCKDB_TEST_HTTPFS_BASE_URL
          if [[ ${url,,} != https://* ]]; then
            echo "::error title=Not HTTPS::DUCKDB_TEST_HTTPFS_BASE_URL must be an https:// URL: $url"
            exit 1
          fi

          # A branch name in place of the commit would follow new pushes, which
          # GitHub serves from a five-minute cache. See test/fixtures/README.md.
          # http://, capitals, a port, a trailing dot, raw.github.com and
          # github.com/<owner>/<repo>/raw/ all reach the same files, so any URL
          # on a GitHub host must be the canonical one. It is also the only
          # prefix test/smoke.c sends the token to.
          host=${url,,}
          host=${host#*://}
          host=${host%%[/?#]*}
          host=${host##*@}
          host=${host%:*}
          host=${host%.}
          github='(^|\.)(github\.com|githubusercontent\.com)$'
          pinned='^https://raw\.githubusercontent\.com/[^/]+/[^/]+/[0-9a-f]{40}/'
          if [[ $host =~ $github && ! $url =~ $pinned ]]; then
            echo "::error title=Unpinned base URL::DUCKDB_TEST_HTTPFS_BASE_URL on GitHub must be https://raw.githubusercontent.com/<owner>/<repo>/<full commit SHA>/..., not a branch, a tag or another spelling: $url"
            exit 1
          fi

          source ./duckdb_version
          status=0
          test/smoke.sh "$TARBALL" "$DUCKDB_VER" include | tee "$RUNNER_TEMP/smoke.log" || status=$?

          summary=$(sed -n '/^== summary$/,$p' "$RUNNER_TEMP/smoke.log" | tail -n +2)
          if [ -z "$summary" ]; then
            summary="test/smoke.sh exited $status before its summary, see the log"
          fi
          {
            echo "### httpfs remote (${{ matrix.arch }})"
            echo "Tested: \`$(cat "$TARBALL.sha256")\`"
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Reported apart from other failures, so the job summaries show how
          # often GitHub's rate limit stops the run.
          if grep -q '^rate-limited:' "$RUNNER_TEMP/smoke.log"; then
            echo "::warning title=Rate-limited::The fixture host answered HTTP 429 on ${{ matrix.arch }}."
          fi
          case $status in
          0) ;;
          3) echo "::error title=Host or network failure::Only the remote run failed, in the host or the network rather than the bundle. See the FAIL lines labeled host: or network:." ;;
          *) echo "::error title=Bundle or configuration failure::A failed check points at the bundle, or the remote run's configuration can't be used. See the FAIL lines." ;;
          esac
          exit $status

  # Builds and invokes example/ against the bundles above. The release doesn't
  # wait for it, because a DuckDB release can ship before a duckdb-go version
  # that matches it exists.
  example:
    needs: build
    uses: ./.github/workflows/example.yml
    with:
      bundle-artifact: true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    # One release job per tag at a time, so a second dispatch's guard runs
    # after the first has created the release. A run that is still waiting is
    # cancelled when a newer one queues for the same tag.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # A dispatch on a tag that already has a release, even a draft, would
      # replace its assets with this run's bundles. A tag push isn't checked, so
      # it still fills a release that someone created for the tag before
      # pushing it. The listing goes through every page, drafts included, and
      # fails rather than come back short: `gh release list` stops at its
      # --limit without an error, and the REST listing errors after 10,000.
      - name: Refuse to replace an existing release's assets
        if: github.event_name == 'workflow_dispatch' && !inputs.overwrite-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name'); then
            echo "::error title=Release lookup failed::Couldn't list every release, so it's unknown whether $TAG already has one."
            exit 1
          fi
          if grep -Fxq -- "$TAG" <<<"$releases"; then
            echo "::error title=Release exists::$TAG already has a release. Dispatch with overwrite-release to replace its assets with this run's."
            exit 1
          fi
          echo "$TAG has no release yet."

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set version variables
        run: |
          source ./duckdb_version
          echo "DUCKDB_VER=$DUCKDB_VER" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: libduckdb-*
          path: ./release
          merge-multiple: true

      - name: List files
        run: |
          echo "Files to be released:"
          ls -lh ./release/

      # Publishes only tarballs whose bytes match the sha256 their build job
      # recorded after the smoke test, one per architecture. The records go out
      # as one SHA256SUMS: example/Makefile downloads the first asset whose name
      # contains the tarball's, so it could pick a published <tarball>.sha256.
      - name: Check that the tarballs are the ones the build smoke-tested
        working-directory: ./release
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(*.tar.xz)
          if [ "${#tarballs[@]}" -ne 2 ]; then
            echo "::error title=Missing tarball::Expected the arm64 and amd64 tarballs, found: ${tarballs[*]}"
            exit 1
          fi
          for t in "${tarballs[@]}"; do
            if [ ! -f "$t.sha256" ] || [ "$(sha256sum "$t")" != "$(cat "$t.sha256")" ]; then
              echo "::error title=Untested tarball::$t doesn't match the sha256 its build recorded after the smoke test."
              exit 1
            fi
          done
          cat "${tarballs[@]/%/.sha256}" > SHA256SUMS
          cat SHA256SUMS
          {
            echo 'Releasing, as smoke-tested:'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./release/*.tar.xz
            ./release/SHA256SUMS
          # main's DuckDB 2.0 releases stay Latest. Their tarballs have the same
          # names, and main's example/Makefile downloads releases/latest.
          make_latest: false
          body: |
            Multi-architecture DuckDB 1.5.x bundle release from the `duckdb-v1.5.x` maintenance branch. Built on Amazon Linux 2023. The release marked Latest is `main`'s DuckDB 2.0 build.

            **Versions:**
            - DuckDB: `${{ env.DUCKDB_VER }}`

            **Variants:**
            - `libduckdb_bundle-{platform}-httpfs-parquet.tar.xz` — DuckDB with core_functions, parquet, json, icu, httpfs

            Each tarball holds only `libduckdb_bundle.a`. Compile against `duckdb.h` from DuckDB `${{ env.DUCKDB_VER }}`. Every database opened through the C API has the five extensions loaded, with nothing to register. See the branch's [README](https://github.com/${{ github.repository }}/tree/duckdb-v1.5.x#linking).

            `SHA256SUMS` holds the sha256 of each tarball, as recorded after its smoke test. Check a download with `sha256sum -c --ignore-missing SHA256SUMS`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
