name: Build DuckDB static bundle on Amazon Linux 2023

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: 'ubuntu-24.04-arm'
            platform: arm64-linux
            build_extensions: 'httpfs;parquet;icu;json;'
            flavor: 'httpfs-parquet'
            DUCKDB_PLATFORM: linux_arm64
            CXXFLAGS: "-march=armv8.2-a+crypto+fp16+dotprod+lse -D_GLIBCXX_USE_CXX11_ABI=1"
          - arch: amd64
            runner: 'ubuntu-latest'
            platform: amd64-linux
            build_extensions: 'httpfs;parquet;icu;json;'
            flavor: 'httpfs-parquet'
            DUCKDB_PLATFORM: linux_amd64
            CXXFLAGS: "-march=x86-64-v3 -D_GLIBCXX_USE_CXX11_ABI=1"
          - arch: arm64
            runner: 'ubuntu-24.04-arm'
            platform: arm64-linux
            build_extensions: 'httpfs;json;icu;parquet;'
            flavor: 'httpfs-parquet-vortex'
            DUCKDB_PLATFORM: linux_arm64
            CXXFLAGS: "-march=armv8.2-a+crypto+fp16+dotprod+lse -D_GLIBCXX_USE_CXX11_ABI=1"
          - arch: amd64
            runner: 'ubuntu-latest'
            platform: amd64-linux
            build_extensions: 'httpfs;json;icu;parquet;'
            flavor: 'httpfs-parquet-vortex'
            DUCKDB_PLATFORM: linux_amd64
            CXXFLAGS: "-march=x86-64-v3 -D_GLIBCXX_USE_CXX11_ABI=1"
          - arch: arm64
            runner: 'ubuntu-24.04-arm'
            platform: arm64-linux
            build_extensions: 'httpfs;parquet;icu;json;'
            flavor: 'httpfs-parquet-lance'
            DUCKDB_PLATFORM: linux_arm64
            CXXFLAGS: "-march=armv8.2-a+crypto+fp16+dotprod+lse -D_GLIBCXX_USE_CXX11_ABI=1"
          - arch: amd64
            runner: 'ubuntu-latest'
            platform: amd64-linux
            build_extensions: 'httpfs;parquet;icu;json;'
            flavor: 'httpfs-parquet-lance'
            DUCKDB_PLATFORM: linux_amd64
            CXXFLAGS: "-march=x86-64-v3 -D_GLIBCXX_USE_CXX11_ABI=1"

    runs-on: ${{ matrix.runner }}

    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023

    steps:
      - name: Install basic tools
        run: |
          dnf update -y
          dnf install --allowerasing \
            wget tar gzip xz git \
            gcc14 gcc14-c++ \
            make curl ninja-build patch \
            openssl-devel zlib-devel libcurl-devel \
            python3 -y

      - name: Install lance dependencies
        if: contains(matrix.flavor, 'lance')
        run: |
          dnf install --allowerasing \
            bzip2-devel protobuf-compiler protobuf-devel -y
          ln -sf /usr/bin/gcc14-gcc /usr/local/bin/cc
          ln -sf /usr/bin/gcc14-g++ /usr/local/bin/c++

      - name: Install latest CMake
        run: |
          wget -O cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.10/cmake-3.31.10-linux-x86_64.tar.gz
          
          tar -zxvf cmake.tar.gz
          cp -r cmake/* /usr/local/
          
          cmake --version

      - name: Install Rust toolchain
        if: contains(matrix.flavor, 'vortex') || contains(matrix.flavor, 'lance')
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set version variables
        run: |
          source ./duckdb_version
          echo "DUCKDB_VER=$DUCKDB_VER" >> $GITHUB_ENV
          echo "LANCE_DUCKDB_VER=$LANCE_DUCKDB_VER" >> $GITHUB_ENV
          echo "DUCKDB_VORTEX_BRANCH=$DUCKDB_VORTEX_BRANCH" >> $GITHUB_ENV
          echo "DUCKDB_EXTENSION_CI_TOOLS_BRANCH=$DUCKDB_EXTENSION_CI_TOOLS_BRANCH" >> $GITHUB_ENV
          echo "VORTEX_VER=$VORTEX_VER" >> $GITHUB_ENV

      - name: Clone DuckDB
        run: git clone --depth 1 --branch $DUCKDB_VER https://github.com/duckdb/duckdb.git

      - name: Clone lance-duckdb and update submodules
        if: contains(matrix.flavor, 'lance')
        run: |
          git clone --depth 1 --branch $LANCE_DUCKDB_VER https://github.com/lance-format/lance-duckdb.git
          ln -s $(realpath duckdb) lance-duckdb/duckdb
          git clone --depth 1 --branch $DUCKDB_EXTENSION_CI_TOOLS_BRANCH https://github.com/duckdb/extension-ci-tools.git lance-duckdb/extension-ci-tools
          # Update Cargo.lock so cargo uses the cloned vortex version instead of the pinned one
          cd lance-duckdb && cargo update --workspace || true

      - name: Clone duckdb-vortex and update submodules
        if: contains(matrix.flavor, 'vortex')
        run: |
          git clone --depth 1 --branch $DUCKDB_VORTEX_BRANCH https://github.com/vortex-data/duckdb-vortex.git
          ln -s $(realpath duckdb) duckdb-vortex/duckdb
          git clone --depth 1 --branch $DUCKDB_EXTENSION_CI_TOOLS_BRANCH https://github.com/duckdb/extension-ci-tools.git duckdb-vortex/extension-ci-tools
          git clone --depth 1 --branch $VORTEX_VER https://github.com/vortex-data/vortex.git duckdb-vortex/vortex
          # Update Cargo.lock so cargo uses the cloned vortex version instead of the pinned one
          cd duckdb-vortex && cargo update --workspace || true

      - name: Cache Rust build artifacts (vortex)
        if: contains(matrix.flavor, 'vortex')
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            duckdb-vortex/vortex/target
          key: ${{ runner.os }}-${{ matrix.arch }}-vortex-${{ hashFiles('duckdb-vortex/vortex/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-vortex-

      - name: Cache Rust build artifacts (lance)
        if: contains(matrix.flavor, 'lance')
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lance-duckdb/target
          key: ${{ runner.os }}-${{ matrix.arch }}-lance-${{ hashFiles('lance-duckdb/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-lance-

      - name: Build DuckDB bundle
        run: |
          pushd duckdb
          mkdir -p build/release/vcpkg_installed/${{ matrix.platform }}/lib

          export CC=/usr/bin/gcc14-gcc
          export CXX=/usr/bin/gcc14-g++
          export LDFLAGS="-Wl,--gc-sections -Wl,--strip-all"
          export CXXFLAGS="${{ matrix.CXXFLAGS }} -ffunction-sections -fdata-sections"
          export CFLAGS="${{ matrix.CXXFLAGS }} -ffunction-sections -fdata-sections"
          export MAKEFLAGS="-j$(nproc)"

          echo "Compiler version:"
          $CXX --version | head -1

          if [[ "${{ matrix.flavor }}" == *"lance"* ]]; then
            export RUSTFLAGS="-C strip=debuginfo"
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=z
            export CARGO_PROFILE_RELEASE_PANIC=abort
            export CARGO_PROFILE_RELEASE_LTO=thin
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
            export EXTENSION_CONFIGS="$(pwd)/../lance-duckdb/extension_config.cmake"
            echo "Rust version:"
            cargo --version
          fi

          if [[ "${{ matrix.flavor }}" == *"vortex"* ]]; then
            export RUSTFLAGS="-C strip=debuginfo"
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=z
            export CARGO_PROFILE_RELEASE_PANIC=abort
            export CARGO_PROFILE_RELEASE_LTO=thin
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
            export EXTENSION_CONFIGS="$(pwd)/../duckdb-vortex/extension_config.cmake"
            echo "Rust version:"
            cargo --version
          fi

          GEN=ninja \
          DUCKDB_PLATFORM=${{ matrix.DUCKDB_PLATFORM }} \
          BUILD_SHELL=0 \
          DISABLE_EXTENSION_LOAD=1 \
          EXTENSION_STATIC_BUILD=1 \
          BUILD_EXTENSIONS="${{ matrix.build_extensions }}" \
          EXTRA_CMAKE_VARIABLES="-DCMAKE_CXX_FLAGS_RELEASE=-Os -DCMAKE_C_FLAGS_RELEASE=-Os" \
          make bundle-library
          objcopy --strip-debug build/release/libduckdb_bundle.a
          popd

      - name: Package bundle
        run: |
          mkdir -p /tmp/pkg
          cp duckdb/build/release/libduckdb_bundle.a /tmp/pkg/
          if [[ "${{ matrix.flavor }}" == *"vortex"* ]]; then
            find duckdb/build/release -name "libvortex_duckdb.a" -exec cp {} /tmp/pkg/ \;
          fi
          if [[ "${{ matrix.flavor }}" == *"lance"* ]]; then
            find duckdb/build/release -name "liblance_duckdb_ffi.a" -exec cp {} /tmp/pkg/ \;
          fi
          echo "Package contents:"
          ls -lh /tmp/pkg/
          tar -cJf libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz -C /tmp/pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libduckdb-${{ matrix.arch }}-${{ matrix.flavor }}
          path: libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: libduckdb-*
          path: ./release
          merge-multiple: true

      - name: List files
        run: |
          echo "Files to be released:"
          ls -lh ./release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/*
          body: |
            Multi-architecture DuckDB bundle release. Built on Amazon Linux 2023.

            **Variants:**
            - `libduckdb_bundle-{arch}.tar.xz` — DuckDB with httpfs, parquet, icu, json
            - `libduckdb_bundle-lance-{arch}.tar.xz` — DuckDB with httpfs, parquet, icu, json, lance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
