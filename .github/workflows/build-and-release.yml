name: Build DuckDB static bundle on Amazon Linux 2023

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: 'ubuntu-24.04-arm'
            platform: arm64-linux
            build_extensions: 'core_functions;parquet;json;icu;httpfs'
            flavor: 'httpfs-parquet'
            DUCKDB_PLATFORM: linux_arm64
            CXXFLAGS: "-march=armv8.2-a+crypto+fp16+dotprod+lse -D_GLIBCXX_USE_CXX11_ABI=1"
          - arch: amd64
            runner: 'ubuntu-latest'
            platform: amd64-linux
            build_extensions: 'core_functions;parquet;json;icu;httpfs'
            flavor: 'httpfs-parquet'
            DUCKDB_PLATFORM: linux_amd64
            CXXFLAGS: "-march=x86-64-v3 -D_GLIBCXX_USE_CXX11_ABI=1"

    runs-on: ${{ matrix.runner }}

    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023

    steps:
      - name: Install basic tools
        run: |
          dnf update -y
          dnf install --allowerasing \
            wget tar gzip xz git \
            gcc14 gcc14-c++ \
            make curl ninja-build patch \
            openssl-devel zlib-devel libcurl-devel \
            python3 -y

      - name: Install latest CMake
        run: |
          CMAKE_VER="3.31.10"
          case "${{ matrix.platform }}" in
            amd64-linux)  CMAKE_ARCH="linux-x86_64" ;;
            arm64-linux)  CMAKE_ARCH="linux-aarch64" ;;
            *) echo "Unsupported platform: ${{ matrix.platform }}"; exit 1 ;;
          esac
          wget -q -O cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-${CMAKE_ARCH}.tar.gz
          tar -zxf cmake.tar.gz
          cp -rf cmake-${CMAKE_VER}-${CMAKE_ARCH}/* /usr/local/ 2>/dev/null
          cmake --version

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set version variables
        run: |
          source ./duckdb_version
          echo "DUCKDB_VER=$DUCKDB_VER" >> $GITHUB_ENV

      - name: Clone DuckDB
        run: git clone --depth 1 --branch $DUCKDB_VER https://github.com/duckdb/duckdb.git

      # DuckDB 2.0 builds the engine and each extension as separate archives;
      # the Package step below merges them into libduckdb_bundle.a.
      #
      # DUCKDB_VERSION: 2.0 no longer reads the version from the git tag. Without
      # it, a shallow clone of v2.0.0 reports v2.0.0-dev1.
      # DUCKDB_NEW_EXTENSION_BUILD=0: 2.0's new extension build path refuses
      # httpfs without vcpkg. The legacy path fetches httpfs at the same pinned
      # commit and links it against the system libcurl and OpenSSL, as 1.5.x did.
      - name: Build DuckDB
        run: |
          pushd duckdb

          export CC=/usr/bin/gcc14-gcc
          export CXX=/usr/bin/gcc14-g++
          export LDFLAGS="-Wl,--gc-sections -Wl,--strip-all"
          export CXXFLAGS="${{ matrix.CXXFLAGS }} -ffunction-sections -fdata-sections"
          export CFLAGS="${{ matrix.CXXFLAGS }} -ffunction-sections -fdata-sections"
          export MAKEFLAGS="-j$(nproc)"

          echo "Compiler version:"
          $CXX --version | head -1

          DUCKDB_VERSION=$DUCKDB_VER \
          DUCKDB_NEW_EXTENSION_BUILD=0 \
          GEN=ninja \
          DUCKDB_PLATFORM=${{ matrix.DUCKDB_PLATFORM }} \
          BUILD_SHELL=0 \
          DISABLE_EXTENSION_LOAD=1 \
          EXTENSION_STATIC_BUILD=1 \
          BUILD_EXTENSIONS="${{ matrix.build_extensions }}" \
          STATICALLY_LINK_EXTENSIONS="${{ matrix.build_extensions }}" \
          EXTRA_CMAKE_VARIABLES="-DCMAKE_CXX_FLAGS_RELEASE=-Os -DCMAKE_C_FLAGS_RELEASE=-Os" \
          make release
          popd

      - name: Package bundle
        env:
          CXX: /usr/bin/gcc14-g++
          CXXFLAGS: ${{ matrix.CXXFLAGS }} -ffunction-sections -fdata-sections
        run: |
          scripts/package-bundle.sh duckdb "${{ matrix.build_extensions }}" \
            libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz

      - name: Smoke-test bundle
        env:
          CC: /usr/bin/gcc14-gcc
        run: |
          test/smoke.sh libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz "$DUCKDB_VER"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libduckdb-${{ matrix.arch }}-${{ matrix.flavor }}
          path: libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz
          retention-days: 1

  # Builds and invokes example/ against the bundles above. The release doesn't
  # wait for it, because a DuckDB release can ship before a duckdb-go version
  # that matches it exists.
  example:
    needs: build
    uses: ./.github/workflows/example.yml
    with:
      bundle-artifact: true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set version variables
        run: |
          source ./duckdb_version
          echo "DUCKDB_VER=$DUCKDB_VER" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: libduckdb-*
          path: ./release
          merge-multiple: true

      - name: List files
        run: |
          echo "Files to be released:"
          ls -lh ./release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release/*
          body: |
            Multi-architecture DuckDB bundle release. Built on Amazon Linux 2023.

            **Versions:**
            - DuckDB: `${{ env.DUCKDB_VER }}`

            **Variants:**
            - `libduckdb_bundle-{platform}-httpfs-parquet.tar.xz` — DuckDB with core_functions, parquet, json, icu, httpfs

            Since DuckDB 2.0 the extensions must be registered before the first database opens: call `duckdb_register_static_extensions()`, or link with `-Wl,-u,duckdb_register_static_extensions`. See the README.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
