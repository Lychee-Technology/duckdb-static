name: Build DuckDB static bundle on Amazon Linux 2023

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: 'ubuntu-24.04-arm'
            platform: arm64-linux
            DUCKDB_PLATFORM: linux_arm64
            CXXFLAGS: "-march=armv8.2-a+crypto+fp16+dotprod+lse -D_GLIBCXX_USE_CXX11_ABI=1"
          - arch: amd64
            runner: 'ubuntu-latest'
            platform: amd64-linux
            DUCKDB_PLATFORM: linux_amd64
            CXXFLAGS: "-march=x86-64-v3 -D_GLIBCXX_USE_CXX11_ABI=1"

    runs-on: ${{ matrix.runner }}

    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023

    steps:
      - name: Install basic tools
        run: |
          dnf update -y
          dnf install --allowerasing \
            tar gzip xz git cmake \
            gcc14 gcc14-c++ \
            make curl ninja-build \
            openssl-devel zlib-devel libcurl-devel \
            python3 -y

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set duckdb_version variable
        run: |
          echo "Setting DUCKDB_VER variable"
          source ./duckdb_version
          echo "DUCKDB_VER=$DUCKDB_VER" >> $GITHUB_ENV

      - name: Clone DuckDB
        run: |
          git clone --depth 1 --branch $DUCKDB_VER https://github.com/duckdb/duckdb.git

      - name: Build DuckDB bundle
        run: |
          pushd duckdb
          mkdir -p build/release/vcpkg_installed/${{ matrix.platform }}/lib

          export CC=/usr/bin/gcc14-gcc
          export CXX=/usr/bin/gcc14-g++
          export LDFLAGS="-Wl,--gc-sections -Wl,--strip-all"
          export CXXFLAGS="${{ matrix.CXXFLAGS }}"
          export CFLAGS="${{ matrix.CXXFLAGS }}"
          export MAKEFLAGS="-j$(nproc)"

          echo "Compiler version:"
          $CXX --version | head -1

          GEN=ninja \
          DUCKDB_PLATFORM=${{ matrix.DUCKDB_PLATFORM }} \
          BUILD_SHELL=0 \
          DISABLE_EXTENSION_LOAD=1 \
          EXTENSION_STATIC_BUILD=1 \
          BUILD_EXTENSIONS="httpfs;parquet;icu;json;" \
          make bundle-library
          popd

      - name: Package library
        run: |
          pushd duckdb
          tar -cJf libduckdb_bundle-${{ matrix.arch }}.tar.xz -C ./build/release libduckdb_bundle.a
          popd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libduckdb-${{ matrix.arch }}
          path: duckdb/libduckdb_bundle-${{ matrix.arch }}.tar.xz
          retention-days: 1

  build-lance:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: 'ubuntu-24.04-arm'
            platform: arm64-linux
            DUCKDB_PLATFORM: linux_arm64
            CXXFLAGS: "-march=armv8.2-a+crypto+fp16+dotprod+lse -D_GLIBCXX_USE_CXX11_ABI=1"
          - arch: amd64
            runner: 'ubuntu-latest'
            platform: amd64-linux
            DUCKDB_PLATFORM: linux_amd64
            CXXFLAGS: "-march=x86-64-v3 -D_GLIBCXX_USE_CXX11_ABI=1"

    runs-on: ${{ matrix.runner }}

    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023

    steps:
      - name: Install basic tools
        run: |
          dnf update -y
          dnf install --allowerasing \
            tar gzip xz git cmake \
            gcc14 gcc14-c++ \
            make curl ninja-build \
            openssl-devel zlib-devel libcurl-devel \
            bzip2-devel protobuf-compiler protobuf-devel \
            python3 -y

      - name: Create cc symlinks for Rust
        run: |
          ln -sf /usr/bin/gcc14-gcc /usr/local/bin/cc
          ln -sf /usr/bin/gcc14-g++ /usr/local/bin/c++

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set version variables
        run: |
          source ./duckdb_version
          echo "DUCKDB_VER=$DUCKDB_VER" >> $GITHUB_ENV
          echo "LANCE_DUCKDB_VER=$LANCE_DUCKDB_VER" >> $GITHUB_ENV

      - name: Clone DuckDB
        run: |
          git clone --depth 1 --branch $DUCKDB_VER https://github.com/duckdb/duckdb.git

      - name: Clone lance-duckdb
        run: |
          git clone --depth 1 --branch $LANCE_DUCKDB_VER https://github.com/lance-format/lance-duckdb.git

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lance-duckdb/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('lance-duckdb/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Build DuckDB lance bundle
        run: |
          pushd duckdb
          mkdir -p build/release/vcpkg_installed/${{ matrix.platform }}/lib

          export CC=/usr/bin/gcc14-gcc
          export CXX=/usr/bin/gcc14-g++
          export LDFLAGS="-Wl,--gc-sections -Wl,--strip-all"
          export CXXFLAGS="${{ matrix.CXXFLAGS }}"
          export CFLAGS="${{ matrix.CXXFLAGS }}"
          export MAKEFLAGS="-j$(nproc)"
          export PATH="$HOME/.cargo/bin:$PATH"
          export RUSTFLAGS="-C strip=debuginfo"
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=z
          export CARGO_PROFILE_RELEASE_PANIC=abort
          export CARGO_PROFILE_RELEASE_LTO=thin
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1

          echo "Compiler version:"
          $CXX --version | head -1
          echo "Rust version:"
          cargo --version

          GEN=ninja \
          DUCKDB_PLATFORM=${{ matrix.DUCKDB_PLATFORM }} \
          BUILD_SHELL=0 \
          DISABLE_EXTENSION_LOAD=1 \
          EXTENSION_STATIC_BUILD=1 \
          EXTENSION_CONFIGS="$(pwd)/../lance-duckdb/extension_config.cmake" \
          make bundle-library
          popd

      - name: Package lance library
        run: |
          mkdir -p /tmp/lance-pkg
          cp duckdb/build/release/libduckdb_bundle.a /tmp/lance-pkg/
          find duckdb/build/release -name "liblance_extension.a" -exec cp {} /tmp/lance-pkg/ \;
          find duckdb/build/release -name "liblance_duckdb_ffi.a" -exec cp {} /tmp/lance-pkg/ \;
          echo "Package contents:"
          ls -lh /tmp/lance-pkg/
          tar -cJf libduckdb_bundle_lance-${{ matrix.arch }}.tar.xz -C /tmp/lance-pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libduckdb-lance-${{ matrix.arch }}
          path: libduckdb_bundle_lance-${{ matrix.arch }}.tar.xz
          retention-days: 1

  release:
    needs: [build, build-lance]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: libduckdb-*
          path: ./release
          merge-multiple: true

      - name: List files
        run: |
          echo "Files to be released:"
          ls -lh ./release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/*
          body: |
            Multi-architecture DuckDB bundle release. Built on Amazon Linux 2023.

            **Variants:**
            - `libduckdb_bundle-{arch}.tar.xz` — DuckDB with httpfs, parquet, icu, json
            - `libduckdb_bundle_lance-{arch}.tar.xz` — DuckDB with httpfs, icu, json, lance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
