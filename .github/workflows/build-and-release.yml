name: Build DuckDB static bundle on Amazon Linux 2023

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: 'ubuntu-24.04-arm'
            platform: arm64-linux
            build_extensions: 'httpfs;parquet;icu;json;'
            flavor: 'httpfs-parquet'
            DUCKDB_PLATFORM: linux_arm64
            CXXFLAGS: "-march=armv8.2-a+crypto+fp16+dotprod+lse -D_GLIBCXX_USE_CXX11_ABI=1"
          - arch: amd64
            runner: 'ubuntu-latest'
            platform: amd64-linux
            build_extensions: 'httpfs;parquet;icu;json;'
            flavor: 'httpfs-parquet'
            DUCKDB_PLATFORM: linux_amd64
            CXXFLAGS: "-march=x86-64-v3 -D_GLIBCXX_USE_CXX11_ABI=1"

    runs-on: ${{ matrix.runner }}

    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023

    steps:
      - name: Install basic tools
        run: |
          dnf update -y
          dnf install --allowerasing \
            wget tar gzip xz git \
            gcc14 gcc14-c++ \
            make curl ninja-build patch \
            openssl-devel zlib-devel libcurl-devel \
            python3 -y

      - name: Install latest CMake
        run: |
          CMAKE_VER="3.31.10"
          case "${{ matrix.platform }}" in
            amd64-linux)  CMAKE_ARCH="linux-x86_64" ;;
            arm64-linux)  CMAKE_ARCH="linux-aarch64" ;;
            *) echo "Unsupported platform: ${{ matrix.platform }}"; exit 1 ;;
          esac
          wget -q -O cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-${CMAKE_ARCH}.tar.gz
          tar -zxf cmake.tar.gz
          cp -rf cmake-${CMAKE_VER}-${CMAKE_ARCH}/* /usr/local/ 2>/dev/null
          cmake --version

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set version variables
        run: |
          source ./duckdb_version
          echo "DUCKDB_VER=$DUCKDB_VER" >> $GITHUB_ENV
          echo "DUCKDB_EXTENSION_CI_TOOLS_BRANCH=$DUCKDB_EXTENSION_CI_TOOLS_BRANCH" >> $GITHUB_ENV

      - name: Clone DuckDB
        run: git clone --depth 1 --branch $DUCKDB_VER https://github.com/duckdb/duckdb.git

      - name: Build DuckDB bundle
        run: |
          pushd duckdb
          mkdir -p build/release/vcpkg_installed/${{ matrix.platform }}/lib

          export CC=/usr/bin/gcc14-gcc
          export CXX=/usr/bin/gcc14-g++
          export LDFLAGS="-Wl,--gc-sections -Wl,--strip-all"
          export CXXFLAGS="${{ matrix.CXXFLAGS }} -ffunction-sections -fdata-sections"
          export CFLAGS="${{ matrix.CXXFLAGS }} -ffunction-sections -fdata-sections"
          export MAKEFLAGS="-j$(nproc)"

          echo "Compiler version:"
          $CXX --version | head -1

          GEN=ninja \
          DUCKDB_PLATFORM=${{ matrix.DUCKDB_PLATFORM }} \
          BUILD_SHELL=0 \
          DISABLE_EXTENSION_LOAD=1 \
          EXTENSION_STATIC_BUILD=1 \
          BUILD_EXTENSIONS="${{ matrix.build_extensions }}" \
          EXTRA_CMAKE_VARIABLES="-DCMAKE_CXX_FLAGS_RELEASE=-Os -DCMAKE_C_FLAGS_RELEASE=-Os" \
          make bundle-library
          objcopy --strip-debug build/release/libduckdb_bundle.a
          popd

      - name: Package bundle
        run: |
          mkdir -p /tmp/pkg
          cp duckdb/build/release/libduckdb_bundle.a /tmp/pkg/
          echo "Package contents:"
          ls -lh /tmp/pkg/
          tar -cJf libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz -C /tmp/pkg .

      # The tarball ships only the archive, so the smoke test compiles against
      # the duckdb.h of the DuckDB checkout the bundle was built from.
      - name: Collect header
        run: |
          mkdir -p include
          cp duckdb/src/include/duckdb.h include/

      - name: Smoke-test bundle
        env:
          CC: /usr/bin/gcc14-gcc
        run: |
          test/smoke.sh libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz "$DUCKDB_VER" include

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libduckdb-${{ matrix.arch }}-${{ matrix.flavor }}
          path: libduckdb_bundle-${{ matrix.platform }}-${{ matrix.flavor }}.tar.xz
          retention-days: 1

      # Lets test/smoke.sh run on this build's tarball without a DuckDB
      # checkout. Not named libduckdb-*, because the release job publishes
      # every artifact matching that pattern.
      - name: Upload header
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-header-${{ matrix.arch }}
          path: include/duckdb.h
          retention-days: 1

  # Runs the fixture queries over real HTTPS on the bundles above, in a fresh
  # Amazon Linux 2023 container, against the copy of test/fixtures/public at the
  # repository variable DUCKDB_TEST_HTTPFS_BASE_URL. Without the variable the
  # job shows as skipped. The release doesn't wait for it, because GitHub can
  # fail or rate-limit the reads while the bundle is fine.
  httpfs-remote:
    name: httpfs remote (${{ matrix.arch }})
    needs: build
    if: vars.DUCKDB_TEST_HTTPFS_BASE_URL != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: 'ubuntu-24.04-arm'
          - arch: amd64
            runner: 'ubuntu-latest'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read

    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023

    env:
      TARBALL: libduckdb_bundle-${{ matrix.arch }}-linux-httpfs-parquet.tar.xz

    steps:
      - name: Install tools
        run: dnf install -y git gcc14 gcc14-c++ libcurl-devel openssl-devel binutils findutils tar xz python3

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the bundle built in this run
        uses: actions/download-artifact@v7
        with:
          name: libduckdb-${{ matrix.arch }}-httpfs-parquet

      # The tarball holds no header, so the test compiles against the one the
      # build uploaded from its DuckDB checkout.
      - name: Download the header built in this run
        uses: actions/download-artifact@v7
        with:
          name: duckdb-header-${{ matrix.arch }}
          path: include

      # The token reaches this step only. test/smoke.sh sends it only to this
      # repository's files on raw.githubusercontent.com and never prints it.
      - name: Smoke-test over HTTPS
        shell: bash
        env:
          CC: /usr/bin/gcc14-gcc
          DUCKDB_TEST_HTTPFS_BASE_URL: ${{ vars.DUCKDB_TEST_HTTPFS_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # A branch name in place of the commit would follow new pushes, which
          # GitHub serves from a five-minute cache. See test/fixtures/README.md.
          # http://, capitals, a port, a trailing dot, raw.github.com and
          # github.com/<owner>/<repo>/raw/ all reach the same files, so any URL
          # on a GitHub host must be the canonical one. It is also the only
          # prefix test/smoke.c sends the token to.
          url=$DUCKDB_TEST_HTTPFS_BASE_URL
          host=${url,,}
          host=${host#*://}
          host=${host%%[/?#]*}
          host=${host##*@}
          host=${host%:*}
          host=${host%.}
          github='(^|\.)(github\.com|githubusercontent\.com)$'
          pinned='^https://raw\.githubusercontent\.com/[^/]+/[^/]+/[0-9a-f]{40}/'
          if [[ $host =~ $github && ! $url =~ $pinned ]]; then
            echo "::error title=Unpinned base URL::DUCKDB_TEST_HTTPFS_BASE_URL on GitHub must be https://raw.githubusercontent.com/<owner>/<repo>/<full commit SHA>/..., not a branch, a tag or another spelling: $url"
            exit 1
          fi

          source ./duckdb_version
          status=0
          test/smoke.sh "$TARBALL" "$DUCKDB_VER" include | tee "$RUNNER_TEMP/smoke.log" || status=$?

          summary=$(sed -n '/^== summary$/,$p' "$RUNNER_TEMP/smoke.log" | tail -n +2)
          if [ -z "$summary" ]; then
            summary="test/smoke.sh exited $status before its summary, see the log"
          fi
          {
            echo "### httpfs remote (${{ matrix.arch }})"
            echo "Tested: \`$(sha256sum "$TARBALL")\`"
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Reported apart from other failures, so the job summaries show how
          # often GitHub's rate limit stops the run.
          if grep -q '^rate-limited:' "$RUNNER_TEMP/smoke.log"; then
            echo "::warning title=Rate-limited::The fixture host answered HTTP 429 on ${{ matrix.arch }}."
          fi
          case $status in
          0) ;;
          3) echo "::error title=Host or network failure::Only the remote run failed, in the host or the network rather than the bundle. See the FAIL lines labeled host: or network:." ;;
          *) echo "::error title=Bundle or configuration failure::A failed check points at the bundle, or the remote run's configuration can't be used. See the FAIL lines." ;;
          esac
          exit $status

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set version variables
        run: |
          source ./duckdb_version
          echo "DUCKDB_VER=$DUCKDB_VER" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: libduckdb-*
          path: ./release
          merge-multiple: true

      - name: List files
        run: |
          echo "Files to be released:"
          ls -lh ./release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release/*
          body: |
            Multi-architecture DuckDB bundle release. Built on Amazon Linux 2023.

            **Versions:**
            - DuckDB: `${{ env.DUCKDB_VER }}`

            **Variants:**
            - `libduckdb_bundle-{platform}-httpfs-parquet.tar.xz` — DuckDB with httpfs, parquet, icu, json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
